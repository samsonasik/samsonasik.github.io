<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="samsonasik">
  <style>
    /* One file for both themes. The violet flips on dark backgrounds,
       the orange accent stays constant. Works when the file is used as
       an &lt;img&gt;, a CSS background, or a favicon. */
    :root { --mark: #6A50D8; }
    @media (prefers-color-scheme: dark) {
      :root { --mark: #B9A6FF; }
    }
    .p { fill: var(--mark); }
    .a { fill: #FF7A1F; }
  </style>

  <rect class="p" x="44" y="16" width="12" height="24"/>
  <rect class="p" x="44" y="60" width="12" height="16"/>
  <rect class="p" x="14" y="44" width="26" height="12"/>
  <rect class="p" x="60" y="44" width="18" height="12"/>
  <rect class="a" x="66" y="18" width="17" height="17" transform="rotate(45 74.5 26.5)"/>
  <rect class="p" x="24" y="68" width="10" height="10" transform="rotate(45 29 73)"/>
</svg>
